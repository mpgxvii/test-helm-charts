{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.bigqueryServiceAccount }}
{{- $sa := $svc.bigqueryServiceAccount }}
{{- $saJson := dict
  "type" ($sa.type | toString)
  "project_id" ($sa.projectId | toString)
  "private_key_id" ($sa.privateKeyId | toString)
  "private_key" ($sa.privateKey | toString)
  "client_email" ($sa.clientEmail | toString)
  "client_id" ($sa.clientId | toString)
  "auth_uri" ($sa.authUri | toString)
  "token_uri" ($sa.tokenUri | toString)
  "auth_provider_x509_cert_url" ($sa.authProviderX509CertUrl | toString)
  "client_x509_cert_url" ($sa.clientX509CertUrl | toString)
  "universe_domain" ($sa.universeDomain | toString)
}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform-backend.serviceFullname" (dict "root" $root "serviceName" $name) }}-bigquery-sa
  labels:
    {{- include "platform-backend.labels" (dict "root" $root "serviceName" $name) | nindent 4 }}
type: Opaque
stringData:
  service-account.json: |
{{ $saJson | toJson | indent 4 }}
---
{{- end }}
{{- end }}
